# Top 10 degree curricula (4-year plans, reusable course slugs across overlapping majors)

majors:
  # 1 — Software Engineering
  - slug: software-engineering
    name: Software Engineering
    description: Application design, development, and delivery for software careers.
    required_courses:
      - intro-programming
      - data-structures
      - algorithms
      - discrete-math
      - calculus-1
      - calculus-2
      - linear-algebra
      - operating-systems
      - databases
      - software-engineering
      - technical-writing
      - ethics-computing
      - capstone-se
    curricula:
      - slug: software-engineering-bs
        name: Software Engineering (B.S.)
        years: 4
        plan:
          - year: 1
            terms:
              - name: Fall
                courses: [english-composition, calculus-1, intro-programming]
              - name: Spring
                courses: [technical-writing, calculus-2, discrete-math, ethics-computing]
          - year: 2
            terms:
              - name: Fall
                courses: [data-structures, linear-algebra, physics-1]
              - name: Spring
                courses: [computer-architecture, algorithms, probability-statistics]
          - year: 3
            terms:
              - name: Fall
                courses: [operating-systems, databases, software-engineering]
              - name: Spring
                courses: [computer-networks, web-development]
          - year: 4
            terms:
              - name: Fall
                courses: [cybersecurity, machine-learning]
              - name: Spring
                courses: [capstone-se]

